[build-system]
requires = ["setuptools==68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "configurable-agents"
version = "0.1.0-dev"
description = "Config-driven LLM agent workflows - Transform YAML into production-grade agent systems"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Yogesh Kumar Singh", email = "yogesh.singh893@gmail.com"}
]
keywords = ["llm", "agents", "workflow", "langchain", "langgraph", "config-driven"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    "langgraph==1.1.3",
    "langchain==1.2.13",
    "langchain-community==0.4.1",
    "langchain-litellm==0.6.1",
    "langchain-google-genai==4.2.1",
    "litellm==1.80.0",
    "python-dotenv==1.2.2",
    "mlflow==3.10.1",
    "sqlalchemy==2.0.48",
    "uvicorn==0.42.0",
    "rich==14.3.3",
    "restrictedpython==8.1",
    "func-timeout==4.3.5",
    "beautifulsoup4==4.14.3",
    "requests==2.32.5",
    "pandas==2.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.3.0",
    "black==26.3.1",
    "ruff==0.15.7",
    "mypy==1.19.1",
    "sphinx==9.1.0",
    "sphinx-autodoc-typehints==3.9.10",
    "sphinx-rtd-theme==3.1.0",
    "myst-parser==5.0.0",
]
ui = [
    "streamlit==1.55.0",
    "gradio==6.9.0",
]
chat = [
    "gradio==6.9.0",
]
webhooks = [
    "aiogram==3.26.0",
    "httpx==0.28.1",
]
sandbox = [
    "docker==7.1.0",
]
windows = [
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
configurable-agents = "configurable_agents.cli:main"

[project.urls]
Homepage = "https://github.com/thatAverageGuy/configurable-agents"
Documentation = "https://github.com/thatAverageGuy/configurable-agents/docs"
Repository = "https://github.com/thatAverageGuy/configurable-agents"
Issues = "https://github.com/thatAverageGuy/configurable-agents/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (require API keys)",
    "manual: marks tests that require manual verification (deselect with '-m \"not manual\"')",
    "requires_api_key: marks tests that require API keys to run (OPENAI_API_KEY, ANTHROPIC_API_KEY, or GOOGLE_API_KEY)",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
